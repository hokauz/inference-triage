services:
  v0:
    build:
      context: ../../..
      dockerfile: compose/benchmarks/v0-mock/Dockerfile
    network_mode: none
    cpus: "4.0"
    mem_limit: 8g
    environment:
      INFERENCE_TRIAGE_EXECUTION_PROFILE: v0-laya-local
      INFERENCE_TRIAGE_CPU_LIMIT: "4"
      INFERENCE_TRIAGE_MEMORY_LIMIT_MIB: "8192"
      INFERENCE_TRIAGE_CONCURRENCY: "1"
      INFERENCE_TRIAGE_IMAGE_DIGEST: ${INFERENCE_TRIAGE_IMAGE_DIGEST:-unknown}
      LAYA_MODEL_DIR: /models/laya/multilingual
      LAYA_THREADS: "4"
      LAYA_MODEL_REVISION: ${LAYA_MODEL_REVISION:-unknown}
      LAYA_MODEL_HASH: ${LAYA_MODEL_HASH:-unknown}
    volumes:
      - ../../../datasets/source/finguard:/inputs:ro
      - ../../../models/laya:/models/laya:ro
      - ../../../artifacts/v0-laya-local:/outputs
    command:
      ["run", "--input", "/inputs/dataset_finguard_desafio_3.csv", "--output-dir", "/outputs/full", "--pack", "assets/packs/finguard/pack.yaml", "--mode", "laya", "--model-dir", "/models/laya/multilingual"]
